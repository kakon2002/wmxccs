[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wmxccs"
dynamic = ["version"]
description = "Cross-platform CCS harmonization, and a glycan and isomer layer beside it: two packages in one repository that share no code and meet through a schema."
requires-python = ">=3.11"
dependencies = [
    # The record models, the licence gate and the loader are all pydantic; nothing
    # else is needed to hold a measurement, to pair one, or to compare two.
    "pydantic>=2.10",
    # Declared at the milestone a code path first reaches it, not before. api.py
    # serves the harmonization contract and the confidence rules; the statistics
    # and the matching beneath it need nothing from it.
    "fastapi>=0.115",
]

# CORRECTED 26 September 2026, and the original wording is kept below it because being
# wrong about this once is the useful part of the record.
#
# IT SAID: "networkx, glycowork and the 44-column featuriser served the glycan graph
# layer, which does not come across." That was true of every milestone up to v0.7.0 and
# is now false. The owner's brief of 26 September 2026 requires a deployable glycan and
# isomer layer on top of this service, so the graph layer, the enumerator and the
# 44-column featuriser HAVE come across, as the second package `wmxglycan` under src.
#
# WHAT HAS NOT CHANGED, and it is the P0 item: none of this is a dependency of wmxccs.
# networkx, glycowork and scikit-learn are declared under the `glycan` extra, so
# `pip install .` still installs a pure-Python CCS service with pydantic and fastapi and
# nothing else, and `pip install .[glycan]` is what the glycan layer costs. There is a
# test on it - tests/test_glycan_boundary.py - because a dependency quietly promoted into
# the base list is precisely the kind of drift a comment cannot catch.
#
# SCIKIT-LEARN WAS PREDICTED HERE AND IS STILL NOT NEEDED BY wmxccs. It returns to this
# file under the `glycan` extra, for the glycan layer's own fit, which refuses to run - so
# it is declared and never imported at runtime today. The paragraph below is about the CCS
# harmonization model and stands unchanged.
#
# The note this replaces said it
# "returns as a dependency of the harmonization model in M4, declared then rather
# than now". M4 arrived on 19 September 2026 and needed nothing: Passing-Bablok is a
# median of pairwise slopes, jackknife+ is a loop of refits, and the rank interval
# uses statistics.NormalDist from the standard library. The whole harmonization
# model is a few hundred lines of pure Python.
#
# That is not a small thing to have got right by accident, so the reason is recorded:
# the statistics in M3 were kept pure Python on purpose - Pearson, Deming,
# Bland-Altman and Lin's concordance are each a handful of sums - and M4 inherited
# the same discipline. Pulling in a numerical stack would have made its version part
# of every figure this platform quotes, for arithmetic anybody can check by hand.

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # fastapi's TestClient needs it.
    "httpx>=0.27",
    # tools/ingest_steroid.py reads the published supporting-information workbook.
    # Only the adapter needs it; the library never opens a spreadsheet.
    "openpyxl>=3.1",
]
# What it takes to SERVE the API rather than import the library. Separated because a
# caller using wmxccs as a library should not be made to install a web server.
serve = [
    "uvicorn>=0.30",
]
# Reading the source workbooks in tools/. Kept out of the runtime dependencies: a
# deployment serves the converted CSV in data/seed and never touches an .xlsx.
ingest = [
    "openpyxl>=3.1",
]
# The glycan and isomer layer, package `wmxglycan`. AN EXTRA AND NOT A DEPENDENCY, so that
# a CCS-only deployment is byte-for-byte the install it was before this layer existed.
glycan = [
    "networkx>=3.2",
    # Pinned exactly, not ranged, because the 50,461-structure SugarBase release and the
    # curated enzyme and constraint tables ship INSIDE this package. The version is part
    # of the dataset version string the licence record quotes, so a range here would let
    # the data under a cited figure change without the citation changing. MIT licensed,
    # Copyright (c) 2021 Daniel Bojar, read from the distribution.
    "glycowork==1.10.0",
    # Declared although glycowork already pulls it in: a transitive edge is a fact about
    # someone else's dependency graph, not a commitment to us. Imported lazily, inside the
    # fit, BELOW every guard - and no current data path reaches it, because no glycan model
    # has ever been trained and training.py refuses rather than pretending.
    "scikit-learn>=1.5",
]

[project.scripts]
# `wmxccs-serve` starts the API with a model fitted from data/seed. Equivalent to
# `python -m wmxccs`, which works without installing.
wmxccs-serve = "wmxccs.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "wmxccs.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# The glycan dashboard is one self-contained HTML file served by wmxglycan.api at "/". It has to
# travel with the package, or an installed deployment serves six working endpoints and no page.
[tool.setuptools.package-data]
wmxglycan = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# So the tests can import tools/, which holds the mutation catalogue. The
# catalogue's anchors are checked on every ordinary pytest run, because a
# mutation that silently stops applying is a loss of coverage that reports
# itself as success.
pythonpath = ["."]
