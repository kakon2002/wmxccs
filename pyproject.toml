[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wmxccs"
dynamic = ["version"]
description = "Cross-platform CCS harmonization: measurements from DTIMS, TWIMS, TIMS and cIMS held apart, paired by matched ion, and harmonized without overwriting the originals."
requires-python = ">=3.11"
dependencies = [
    # The record models, the licence gate and the loader are all pydantic; nothing
    # else is needed to hold a measurement, to pair one, or to compare two.
    "pydantic>=2.10",
    # Declared at the milestone a code path first reaches it, not before. api.py
    # serves the harmonization contract and the confidence rules; the statistics
    # and the matching beneath it need nothing from it.
    "fastapi>=0.115",
]

# Deliberately absent, and worth saying why, because the module these were ported
# from declared all four. networkx, glycowork and the 44-column featuriser served
# the glycan graph layer, which does not come across. scikit-learn served a fit
# that does not exist here yet; it returns as a dependency of the harmonization
# model in M4, declared then rather than now. A dependency declared before a code
# path reaches it is a claim about the platform that the platform does not make.
#
# Note the statistics in M3 are pure Python and stay that way on purpose: Pearson,
# Deming, Bland-Altman and Lin's concordance are each a handful of sums, and
# pulling in a numerical stack to compute them would add a large dependency whose
# version is then part of every figure this platform quotes.

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # fastapi's TestClient needs it.
    "httpx>=0.27",
]

[tool.setuptools.dynamic]
version = { attr = "wmxccs.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# So the tests can import tools/, which holds the mutation catalogue. The
# catalogue's anchors are checked on every ordinary pytest run, because a
# mutation that silently stops applying is a loss of coverage that reports
# itself as success.
pythonpath = ["."]
