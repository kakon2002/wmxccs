[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wmxccs"
dynamic = ["version"]
description = "Cross-platform CCS harmonization: measurements from DTIMS, TWIMS, TIMS and cIMS held apart, paired by matched ion, and harmonized without overwriting the originals."
requires-python = ">=3.11"
dependencies = [
    # The record models, the licence gate and the loader are all pydantic; nothing
    # else is needed to hold a measurement, to pair one, or to compare two.
    "pydantic>=2.10",
    # Declared at the milestone a code path first reaches it, not before. api.py
    # serves the harmonization contract and the confidence rules; the statistics
    # and the matching beneath it need nothing from it.
    "fastapi>=0.115",
]

# Deliberately absent, and worth saying why, because the module these were ported
# from declared all four. networkx, glycowork and the 44-column featuriser served
# the glycan graph layer, which does not come across.
#
# SCIKIT-LEARN WAS PREDICTED HERE AND IS NOT NEEDED. The note this replaces said it
# "returns as a dependency of the harmonization model in M4, declared then rather
# than now". M4 arrived on 19 September 2026 and needed nothing: Passing-Bablok is a
# median of pairwise slopes, jackknife+ is a loop of refits, and the rank interval
# uses statistics.NormalDist from the standard library. The whole harmonization
# model is a few hundred lines of pure Python.
#
# That is not a small thing to have got right by accident, so the reason is recorded:
# the statistics in M3 were kept pure Python on purpose - Pearson, Deming,
# Bland-Altman and Lin's concordance are each a handful of sums - and M4 inherited
# the same discipline. Pulling in a numerical stack would have made its version part
# of every figure this platform quotes, for arithmetic anybody can check by hand.

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # fastapi's TestClient needs it.
    "httpx>=0.27",
    # tools/ingest_steroid.py reads the published supporting-information workbook.
    # Only the adapter needs it; the library never opens a spreadsheet.
    "openpyxl>=3.1",
]
# What it takes to SERVE the API rather than import the library. Separated because a
# caller using wmxccs as a library should not be made to install a web server.
serve = [
    "uvicorn>=0.30",
]
# Reading the source workbooks in tools/. Kept out of the runtime dependencies: a
# deployment serves the converted CSV in data/seed and never touches an .xlsx.
ingest = [
    "openpyxl>=3.1",
]

[project.scripts]
# `wmxccs-serve` starts the API with a model fitted from data/seed. Equivalent to
# `python -m wmxccs`, which works without installing.
wmxccs-serve = "wmxccs.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "wmxccs.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# So the tests can import tools/, which holds the mutation catalogue. The
# catalogue's anchors are checked on every ordinary pytest run, because a
# mutation that silently stops applying is a loss of coverage that reports
# itself as success.
pythonpath = ["."]
